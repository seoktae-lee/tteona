# map-api(지도 타일 서버) 자동 테스트.
# map-api 폴더가 바뀐 push·PR에서만 돈다. iOS 앱이나 다른 서버 코드 변경에는 돌지 않는다.
name: map-api CI

on:
  push:
    paths: ["map-api/**", ".github/workflows/map-api.yml"]
  pull_request:
    paths: ["map-api/**", ".github/workflows/map-api.yml"]

# 같은 브랜치에 새 push가 오면 이전 실행은 취소한다(러너 시간 절약).
concurrency:
  group: map-api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: map-api
    steps:
      - uses: actions/checkout@v4

      # build.gradle.kts의 toolchain(Java 25)과 맞춘다.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      # Gradle 의존성 캐시. 두 번째 실행부터 빨라진다.
      - uses: gradle/actions/setup-gradle@v4

      # Testcontainers가 러너의 Docker로 PostGIS 컨테이너를 띄워 실제 DB로 테스트한다.
      # 같은 이미지(imresamu/postgis)는 amd64도 지원하므로 로컬(arm64)과 결과가 같아야 한다.
      - name: Test
        run: ./gradlew test --no-daemon

      # 실패하면 어떤 테스트가 왜 깨졌는지 보고서를 내려받을 수 있게 남긴다.
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: map-api-test-report
          path: map-api/build/reports/tests/test
          retention-days: 7
