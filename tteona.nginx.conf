server {
    listen 80;
    server_name tteona.kr www.tteona.kr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name tteona.kr www.tteona.kr;
    root /var/www/tteona.kr;
    index index.html;

    # 이미지 업로드(프로필/코스 썸네일) — 기본 1MB로는 사진이 막혀 12MB로 상향
    client_max_body_size 12M;

    ssl_certificate     /etc/letsencrypt/live/tteona.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tteona.kr/privkey.pem;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 코스 공유 OG 링크 — /course?id=UUID 와 /course/UUID 모두 WAS로 프록시
    location /course {
        proxy_pass http://10.20.10.170:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vlog 클립 업로드 — 영상은 크므로 별도 한도
    location /api/vlog/ {
        client_max_body_size 300M;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://10.20.10.170:3000/api/vlog/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vlog 완성본 다운로드 — 파일은 WAS 디스크에 있고 Express가 소유자 검증 후 서빙.
    # 이 location이 빠지면 /uploads/*가 WEB 정적 루트로 떨어져 404 → 앱이 로컬 합성(BGM 없음)으로 폴백한다.
    # ^~ 필수: 아래 정규식 location(\.(jpg|png|...)$)이 prefix보다 우선 매칭되는 것을 차단.
    # 이게 없으면 /uploads/thumbnails/xxx.jpg·/uploads/avatars/xxx.jpg가 WAS로 프록시되지 않고
    # WEB 정적 루트에서 404 → 커스텀 썸네일·아바타가 전부 깨진다.
    location ^~ /uploads/ {
        proxy_pass http://10.20.10.170:3000/uploads/;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket — 그룹 실시간 채팅 + 동행 위치 공유(/ws/location).
    # ⚠️ 이 블록이 빠지면 Upgrade 핸드셰이크가 프록시되지 않아 앱의 채팅·실시간
    #    위치공유가 전부 끊긴다. 운영 서버와 반드시 함께 유지할 것.
    location /ws/ {
        proxy_pass http://10.20.10.170:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket은 오래 열려 있으므로 유휴 타임아웃을 넉넉히 (기본 60s면 끊김)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # REST API
    location /api/ {
        proxy_pass http://10.20.10.170:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 관리자 대시보드 — CSP로 방어선 강화(저장형 XSS 이중 방어).
    #   nginx는 location에 add_header가 있으면 server 레벨 헤더 상속을 끊으므로 전부 재선언한다.
    #   script/style의 'unsafe-inline'은 페이지의 인라인 onclick·<script> 때문에 남지만,
    #   connect-src/img-src를 'self'로 묶어 외부 유출(fetch·이미지 비컨)을 차단하고,
    #   토큰은 httpOnly 쿠키라 스크립트가 읽지도 못한다. Chart.js는 자체 호스팅('self').
    location /admin {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ $uri.html =404;
    }

    # 배포 스크립트가 웹 루트에 남긴 백업본이 공개되지 않도록 차단.
    # 실제로 index.html.bak-*·admin/index.html.bak-* 9개가 공개 노출된 적이 있다(2026-07-26 격리).
    # 백업 경로 자체는 스크립트에서 웹 루트 밖(/home/ubuntu/web-backups)으로 옮겼고, 이건 재발 대비 안전망이다.
    # ^~ /uploads/ 는 정규식보다 우선하므로 프록시 경로는 영향받지 않는다(위 47-49행 주석 참고).
    location ~* \.(bak|old|orig|save|swp|sql|tgz|zip)([-.][0-9a-z_-]*)?$ {
        access_log off;
        return 404;
    }

    # 정적 파일
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|css|js|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/tteona.access.log;
    error_log  /var/log/nginx/tteona.error.log;
}
