server {
    listen 80;
    server_name tteona.kr www.tteona.kr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name tteona.kr www.tteona.kr;
    root /var/www/tteona.kr;
    index index.html;

    # 이미지 업로드(프로필/코스 썸네일) — 기본 1MB로는 사진이 막혀 12MB로 상향
    client_max_body_size 12M;

    ssl_certificate     /etc/letsencrypt/live/tteona.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tteona.kr/privkey.pem;

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 코스 공유 OG 링크 — /course?id=UUID 와 /course/UUID 모두 WAS로 프록시
    location /course {
        proxy_pass http://10.20.10.170:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vlog 클립 업로드 — 영상은 크므로 별도 한도
    location /api/vlog/ {
        client_max_body_size 300M;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_pass http://10.20.10.170:3000/api/vlog/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # REST API
    location /api/ {
        proxy_pass http://10.20.10.170:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 정적 파일
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|css|js|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/tteona.access.log;
    error_log  /var/log/nginx/tteona.error.log;
}
