spring.application.name=map-api

# 로컬에서는 compose.yaml의 PostGIS(5433)에 붙는다.
# 운영·다른 환경에서는 같은 이름의 환경 변수(SPRING_DATASOURCE_URL 등)로 덮어쓴다. 설정을 코드 밖으로 빼 두는 것이 서버 이전 대비다.
spring.datasource.url=jdbc:postgresql://localhost:5433/mapapi
spring.datasource.username=mapapi
spring.datasource.password=mapapi-local

# 테이블은 Flyway가 src/main/resources/db/migration의 SQL을 버전 순서대로 실행해 만든다.
spring.flyway.enabled=true

# 상태 확인용 엔드포인트(/actuator/health)만 연다.
management.endpoints.web.exposure.include=health

# 캐시 크기·수명은 CacheConfig에서 캐시마다 따로 정한다(타일 1시간, 장소 검색 10분).

# 카카오 로컬 API. 키는 코드·저장소에 두지 않고 환경 변수 KAKAO_REST_KEY로만 받는다.
mapapi.kakao.base-url=https://dapi.kakao.com
mapapi.kakao.rest-key=${KAKAO_REST_KEY:}

# Firebase 프로젝트 ID. ID 토큰은 Google 공개 키로 검증하므로 비밀 키(서비스 계정)가 필요 없다.
# 비어 있으면 /places 요청을 전부 401로 거절한다(fail closed).
mapapi.firebase.project-id=${FIREBASE_PROJECT_ID:}

# 사용자(uid)별 장소 검색 요청 한도: 1분에 60회. Node 서버의 번역 API 한도와 같은 수준.
mapapi.places.rate-limit-per-minute=60
