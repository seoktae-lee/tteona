<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>떠나 — 여행 코스 & 그룹 브이로그</title>
  <style>
    :root { --orange: #FF6B35; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #FAFAFA;
      color: #1A1A1A;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 24px;
      text-align: center;
    }
    h1 { font-size: 52px; font-weight: 800; color: var(--orange); margin-bottom: 12px; }
    p { font-size: 16px; color: #555; margin-bottom: 40px; line-height: 1.6; }
    nav { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
    nav a {
      padding: 12px 24px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      border: 1.5px solid var(--orange);
      color: var(--orange);
      transition: background 0.15s, color 0.15s;
    }
    nav a:hover { background: var(--orange); color: #fff; }
  </style>
</head>
<body>
  <h1>떠나</h1>
  <p>여행 코스를 함께 계획하고, 순간을 담아 브이로그로 완성하세요.</p>

    <a href="terms.html">이용약관 / Terms of Service</a>
    <a href="privacy.html">개인정보처리방침 / Privacy Policy</a>
    <a href="child-safety.html">아동 안전 기준 정책 / Child Safety Policy</a>
  </nav>
</body>
</html>
